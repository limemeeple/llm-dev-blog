baseURL = "https://limemeeple.github.io/llm-dev-blog/"
title = "LLM 개발 일지"
theme = "PaperMod"

defaultContentLanguage = "ko"
languageCode = "ko-kr"

# 페이지네이션 (한 페이지에 보여줄 글 수)
[pagination]
  pagerSize = 10

# 코드 하이라이팅
[markup]
  [markup.highlight]
    style = "github-dark"
    lineNos = true
    noClasses = true

[params]
  # 메인 화면 모드: "posts" 목록을 첫 화면에 보여줌
  defaultTheme = "auto"        # auto | light | dark
  ShowReadingTime = true
  ShowShareButtons = false
  ShowCodeCopyButtons = true   # 코드 블록에 복사 버튼
  ShowToc = true               # 목차
  TocOpen = false
  sort_order = "desc"

  [params.profileMode]
  enabled = true
  title = "라임미플의 AI 경험 도서관"
  subtitle = "RAG 프로젝트 개발 기록 과 AI 공부한 내용을 기록한 블로그"
  imageUrl = "images/home_img.png"   # 없으면 이 줄 삭제
  imageWidth = 400
  imageHeight = 400
  imageTitle = "avatar"

  [[params.profileMode.buttons]]
    name = "개발일지"
    url = "posts/"

  [[params.profileMode.buttons]]
    name = "공부일지"
    url = "study/"

  # 홈 화면 소개
  [params.homeInfoParams]
    Title = "AI 공부 및 개발일지 블로그에 오신걸 환영합니다. 👋"

  # 소셜 링크 (필요 없으면 지워도 됨)
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/your-username"

# 상단 메뉴
[menu]
  [[menu.main]]
    identifier = "posts"

    name = "개발일지"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "study"
    name = "공부일지"
    url = "/study/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "태그"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "검색"
    url = "/search/"
    weight = 40

# 검색 기능을 위한 출력 설정
[outputs]
  home = ["HTML", "RSS", "JSON"]